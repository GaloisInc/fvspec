pre-commit:
  parallel: true
  commands:
    format:
      root: "benchmark/"
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    lint:
      root: "benchmark/"
      glob: "*.py"
      run: uv run ruff check {staged_files}
    typecheck:
      root: "benchmark/"
      glob: "*.py"
      run: uv run ty check
    test:
      root: "benchmark/"
      glob: "*.py"
      run: uv run pytest
