pre-commit:
  parallel: false
  commands:
    # Benchmark: format, lint, typecheck, test
    format-benchmark:
      root: "benchmark/"
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    lint-benchmark:
      root: "benchmark/"
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    typecheck-benchmark:
      root: "benchmark/"
      glob: "*.py"
      run: uv run ty check
    test-benchmark:
      root: "benchmark/"
      glob: "*.py"
      run: uv run pytest

    # Baselines: format, lint
    format-baselines:
      root: "baselines/"
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    lint-baselines:
      root: "baselines/"
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true

    # Leaderboard: build first (needed for type resolution), then format/lint/typecheck
    build-leaderboard:
      root: "leaderboard"
      glob: "*.{ts,tsx}"
      run: npm run build
    format-leaderboard:
      root: "leaderboard"
      glob: "*.{ts,json,md,yaml,yml}"
      run: npm run format
      stage_fixed: true
    lint-leaderboard:
      root: "leaderboard"
      glob: "*.{ts,tsx}"
      run: npm run lint:fix
      stage_fixed: true
    typecheck-leaderboard:
      root: "leaderboard"
      glob: "*.{ts,tsx}"
      run: npm run typecheck
