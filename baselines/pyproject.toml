[project]
name = "baselines"
version = "0.1.0"
description = "Baseline evaluation tools for fvspec benchmark"
readme = "README.md"
authors = [
    { name = "Quinn Dougherty", email = "quinn@for-all.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.6.0",
    "inspect-ai>=0.3.188",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "tomli-w>=1.2.0",
    "typer>=0.24.1",
]

[project.scripts]
baselines = "baselines:main"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "ty>=0.0.18",
]
