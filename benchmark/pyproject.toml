[project]
name = "generate"
version = "0.1.0"
description = "New Lean benchmark for real-world SWE tasks"
readme = "README.md"
authors = [
    { name = "Quinn Dougherty", email = "quinn.dougherty.forall@gmail.com" },
    { name = "Hazel Shackleton", email = "hazel.shackleton@galois.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.77.1",
    "datasets>=4.1.1",
    "hvplot>=0.12.1",
    "inspect-ai>=0.3.142",
    "jinja2>=3.1.6",
    "jsonlines>=4.0.0",
    "lzstring>=1.0.4",
    "mcp>=1.18.0",
    "pandas>=2.3.3",
    "panel>=1.8.2",
    "pydantic>=2.12.4",
    "pydantic-ai>=1.7.0",
    "python-dotenv>=1.1.1",
    "radon>=6.0.1",
    "rich>=13.9.4",
    "sqlmodel>=0.0.27",
    "streamlit>=1.50.0",
    "tqdm>=4.67.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "trio>=0.31.0",
    "typer>=0.19.2",
    "wandb>=0.22.2",
]

[project.scripts]
preview-prompts = "generate.templates:main"
fvspec = "generate:main"
check-run = "scripts.check_run:app"
analyze-deps-regex = "scripts.analyze_deps_regex:cli"
analyze-deps = "scripts.analyze_deps:main"
classify-unit-tests = "scripts.classify_unit_tests:app"
test-unit-extraction = "scripts.test_unit_extraction:app"
data-explorer = "scripts.data_explorer:cli"
unit-test-dashboard = "scripts.unit_test_dashboard:cli"
doteval-dashboard = "scripts.eval_dashboard:cli"
compute-radon-metrics = "scripts.compute_radon_metrics:cli"
import-radon-metrics = "scripts.import_radon_metrics:cli"
ci-digest = "scripts.ci.ci_digest:app"
create-ci-db = "scripts.ci.create_ci_db:app"
postprod = "scripts.postproduction:app"
fix-eval-status = "scripts.ops.fix_eval_status:main"
dedup-realpbt = "scripts.realpbt.dedup:app"
extract-deps = "scripts.realpbt.extract_deps:app"
realpbt-pipeline = "scripts.realpbt.pipeline:app"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning",  # source unconfirmed, possibly introduced by wandb dependency
]

[tool.ruff.lint]
select = ["F", "UP", "I", "D", "PT"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.140.3",
    "pytest>=9.0.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.6",
    "ty>=0.0.1a27",
]
