# fvspec prompt variant registry
# Master index of all available prompt variants for A/B testing

[meta]
default_variant = "control-functional"
description = "Registry of prompt variants for fvspec benchmark experiments"

[variants.control-functional]
path = "variants/control-functional"
style = "functional"
description = "Default FVAPPS-style functional verification (control condition)"
tags = ["functional", "stable", "control"]

[variants.control-mvcgen]
path = "variants/control-mvcgen"
style = "mvcgen"
description = "Default imperative verification with mvcgen and Hoare logic (control condition)"
tags = ["mvcgen", "stable", "control"]

[variants.terse-functional]
path = "variants/terse-functional"
style = "functional"
description = "Minimal instructions for functional verification (tests concision hypothesis)"
tags = ["functional", "treatment"]
based_on = "control-functional"
