[agent]
model = "anthropic/claude-sonnet-4-5-20250929"
max_tokens = -1

[meta]
# Display mode for inspect_ai eval TUI: full, conversation, rich, plain, log, none
display = "rich"
# Number of samples to evaluate in parallel
parallelism = 128

[prompt]
# Prompt variant from registry.toml
# If not specified, uses registry default ("control-functional")
# variant = "control-functional"

[dataset]
# Number of samples to draw from the dataset
sample_size = 10
# Random seed for dataset sampling
ranseed = 0

[wandb]
# Enable Weights & Biases logging
enabled = true
# Project name in wandb
project = "fvspec"
# Entity/team name (optional, defaults to your personal account)
entity = "fvspec"
# Additional tags for runs
tags = []
# Upload all sample outputs as artifacts (Spec.lean, qa.json, datapoint.json)
upload_samples = true
# Sync dependency cache: download at start, upload at end of runs
sync_dep_cache = true
