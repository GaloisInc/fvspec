# Manifest for post-production analysis
# Lists W&B runs to download and aggregate for analysis

# Project configuration
[project]
entity = "fvspec"
project = "fvspec"

# Local storage path (relative to benchmark/ root)
# Uses artifacts/ which is already gitignored
output_dir = "artifacts/postproduction"

# Runs to analyze
# Each run is identified by its W&B run ID
# You can find run IDs in the W&B dashboard URL or via: wandb run list

[[runs]]
# Example: Sequential sampling run
id = "wqd4mi3y"
name = "2025-11-20T07-48-32__control-functional__idx0-2"
notes = "Test sequential sampling idx0-2"

[[runs]]
# Example: Random sampling run
id = "8ld0ihci"
name = "2025-11-20T07-45-23__control-functional__s0__n2"
notes = "Test random sampling s0 n2"

