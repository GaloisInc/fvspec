[project]
name = "scraper"
version = "0.1.0"
description = "Scrape Hypothesis property-based tests and their contexts from GitHub"
readme = "README.md"
authors = [
    { name = "Quinn Dougherty", email = "quinn@for-all.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "astor==0.8.1",
    "tqdm==4.66.3",
    "parse==1.19.0",
    # psycopg2-binary ships prebuilt wheels (bundled libpq), so `uv sync` works in
    # CI and on bare machines without pg_config / libpq-dev. Same import as psycopg2.
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.2.2",
    "aiohttp==3.14.1",
    "openai==1.99.9",
]

[project.scripts]
scraper = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: modules live at the top level rather than under a src/ package.
include = [
    "db.py",
    "githubAsync.py",
    "license.py",
    "main.py",
    "migrator.py",
    "parse.py",
    "migrations",
    "embed",
    "summerize",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.2",
    "ty>=0.0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# `examples/` holds sample Python projects (scrape fixtures) and `embed/` is an
# experimental embedding-search tool with undeclared optional deps (cohere,
# pgvector, numpy); neither is part of the core scraper, so keep both out of
# ruff/ty.
[tool.ruff]
extend-exclude = ["examples", "embed"]

[tool.ty.src]
exclude = ["examples", "embed"]
