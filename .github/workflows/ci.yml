name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      benchmark: ${{ steps.filter.outputs.benchmark }}
      leaderboard: ${{ steps.filter.outputs.leaderboard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            benchmark:
              - 'benchmark/**'
            leaderboard:
              - 'leaderboard/**'

  benchmark-checks:
    name: BENCHMARK: ruff, ty, and tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.benchmark == 'true'
    defaults:
      run:
        working-directory: benchmark
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "benchmark/uv.lock"
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync
      - name: Format check
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run ty check
      - name: Run tests
        run: uv run pytest -xvs

  leaderboard-checks:
    name: LEADERBOARD: prettier, eslint, typecheck, and build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.leaderboard == 'true'
    defaults:
      run:
        working-directory: leaderboard

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
        # TODO: Have cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm exec prettier --check --ignore-path ./../.gitignore .
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: Build all packages
        run: pnpm run build
