# fvspec Leaderboard API - Nginx Configuration (Optional)
# This configuration is OPTIONAL - only use if you want to serve the API
# on a separate subdomain (e.g., api.leaderboard.fvspec.org) instead of
# as a reverse proxy from the main domain (/api/ prefix).
#
# Most deployments should use the main nginx-leaderboard.conf which includes
# API reverse proxy under /api/. Use this file only for advanced setups.
#
# Installation:
#   1. Copy to /etc/nginx/sites-available/api.leaderboard.fvspec.org
#   2. Symlink to /etc/nginx/sites-enabled/
#   3. Run: sudo nginx -t
#   4. Run: sudo systemctl reload nginx
#   5. Setup SSL: sudo certbot --nginx -d api.leaderboard.fvspec.org

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.leaderboard.fvspec.org;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server - API Backend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.leaderboard.fvspec.org;

    # SSL Configuration (managed by certbot)
    # Certbot will add ssl_certificate and ssl_certificate_key directives here
    # ssl_certificate /etc/letsencrypt/live/api.leaderboard.fvspec.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.leaderboard.fvspec.org/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/plain text/css text/xml;

    # Logging
    access_log /var/log/nginx/api.leaderboard.access.log;
    error_log /var/log/nginx/api.leaderboard.error.log;

    # Main API Proxy Location
    location / {
        # Proxy to Hono API backend on port 3001
        proxy_pass http://localhost:3001/;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Handle OPTIONS requests for CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Rate limiting (optional - adjust as needed)
        # limit_req zone=api_limit burst=20 nodelay;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        proxy_pass http://localhost:3001/health;
        proxy_set_header Host $host;
    }

    # Security: Deny all hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Rate limiting configuration (optional)
# Uncomment and adjust these in the http block of /etc/nginx/nginx.conf if needed:
#
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# limit_req_status 429;
