# fvspec Leaderboard - Nginx Configuration
#
# Architecture: AWS ELB (SSL termination) → nginx (HTTP) → Services
#   - ELB handles HTTPS on port 443, forwards HTTP to nginx on port 80
#   - nginx proxies to Next.js SSR (port 3000) and Hono API (port 3002)
#   - DO NOT run certbot - it will conflict with ELB SSL
#
# Installation:
#   sudo cp nginx-leaderboard.conf /etc/nginx/sites-available/fvspec-leaderboard
#   sudo ln -sf /etc/nginx/sites-available/fvspec-leaderboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Production: https://fvspec-benchmark.galois.com
# Monorepo: /home/quinnd/fvspec-website/

server {
    # Listen on HTTP only - ELB handles HTTPS
    listen 80;
    listen [::]:80;

    server_name fvspec-benchmark.galois.com;

    # Trust X-Forwarded-Proto from ELB
    # This is critical for correct URL generation in the app
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;  # Trust ELB (in production, limit to ELB IP range)

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Logging
    access_log /var/log/nginx/leaderboard.access.log;
    error_log /var/log/nginx/leaderboard.error.log;

    # API Reverse Proxy
    # Forward /api/* to Hono API on port 3002
    location /api/ {
        proxy_pass http://localhost:3002/;

        # Preserve headers from ELB
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Allow-Private-Network' 'true' always;

        # CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
            add_header 'Access-Control-Allow-Private-Network' 'true';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Frontend Reverse Proxy
    # Forward everything else to Next.js SSR on port 3000
    location / {
        proxy_pass http://localhost:3000;

        # Preserve headers from ELB
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # WebSocket support (for HMR in dev, future real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for SSR responses
        proxy_buffering off;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
