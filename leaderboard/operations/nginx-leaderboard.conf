# fvspec Leaderboard - Nginx Configuration
# This file serves as the single source of truth for nginx configuration
# on the production server.
#
# Installation:
#   1. Copy to /etc/nginx/sites-available/fvspec-leaderboard
#   2. Symlink to /etc/nginx/sites-enabled/
#   3. Run: sudo nginx -t
#   4. Run: sudo systemctl reload nginx
#   5. Setup SSL: sudo certbot --nginx -d fvspec-benchmark.galois.com
#
# Production domain: fvspec-benchmark.galois.com
# Monorepo location: /home/quinnd/fvspec/

# Main Server Configuration
# Currently configured for HTTP-only prototype deployment
# For production SSL, see comments below about enabling HTTPS
server {
    # HTTP-only (before SSL setup)
    listen 80;
    listen [::]:80;

    # For production with SSL, uncomment after running certbot:
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;

    server_name fvspec-benchmark.galois.com;

    # SSL Configuration (managed by certbot)
    # Run: sudo certbot --nginx -d fvspec-benchmark.galois.com
    # Certbot will automatically add ssl_certificate directives here
    # ssl_certificate /etc/letsencrypt/live/fvspec-benchmark.galois.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fvspec-benchmark.galois.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root directory for Next.js static export
    # Monorepo location: /home/quinnd/fvspec/
    root /home/quinnd/fvspec/leaderboard/packages/web/out;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Logging
    access_log /var/log/nginx/leaderboard.access.log;
    error_log /var/log/nginx/leaderboard.error.log;

    # API Reverse Proxy
    # Forward /api/* requests to the Hono API backend on port 3001
    location /api/ {
        # Proxy to API backend
        proxy_pass http://localhost:3001/;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS headers for API
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;

        # Handle OPTIONS requests for CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Static Assets - Aggressive Caching
    # Next.js uses content-hash filenames, so we can safely cache for a long time
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # CORS for static assets (fonts, images, etc.)
        add_header 'Access-Control-Allow-Origin' '*';

        # Try to serve the file, then fall back to 404
        try_files $uri =404;
    }

    # Next.js Static Assets from _next directory
    location /_next/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Disable caching for HTML files (for SPA navigation)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Main location block - Client-Side Routing Support
    # This enables Next.js App Router client-side navigation
    location / {
        # Try to serve static file first, then directory, then fall back to index.html
        # This ensures /leaderboard, /submit, /paper routes work correctly
        try_files $uri $uri/ /index.html =404;

        # Disable cache for HTML to ensure fresh content
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Explicitly serve index.html at root
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Deny access to sensitive files
    location ~ ^/(\.env|\.git|\.gitignore|package\.json|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|tsconfig\.json|next\.config\.*) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Robots.txt and sitemap.xml
    location = /robots.txt {
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        try_files $uri =404;
        log_not_found off;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint (for monitoring)
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
